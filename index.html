<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swingshop - 全球激安通販市場</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f0f0; margin: 0; padding: 0; }
        .header { background: #e60012; color: white; padding: 20px; text-align: center; border-bottom: 5px solid #b3000e; }
        .shop-name { font-size: 40px; font-weight: bold; margin: 0; }
        .yasui-text { font-size: 16px; margin-top: 5px; color: #fff; }
        .main-container { max-width: 1000px; margin: 20px auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .product-card { background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; text-align: center; padding: 15px; }
        .product-card img { width: 100%; height: 250px; object-fit: contain; background: #fff; }
        .price { color: #e60012; font-size: 28px; font-weight: bold; }
        .yasui-label { color: #ff0000; font-size: 14px; }
        .btn { display: block; background: #e60012; color: white; padding: 12px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 10px; }
        .footer { background: #333; color: #ccc; text-align: center; padding: 30px; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="shop-name">swingshop</h1>
    <p class="yasui-text">（やすいよ）</p>
</div>

<div class="main-container">
    <div class="product-card">
        <img src="https://images.nintendolife.com/60933758364b9/nintendo-switch-oled-model.900x.jpg" alt="Switch 2">
        <div class="card-body">
            <h2>最新型 Switsh 2 本体<br>(デジタル版)</h2>
            <p class="price">4,999円 <span class="yasui-label">（やすいよ）</span></p>
            <a href="switch2.html" class="btn">Switch 2 を詳しく見る</a>
        </div>
    </div>

    <div class="product-card">
        <img src="https://drive.google.com/thumbnail?id=186M5SBM06T8TIEL6YFrJhQ7I2lPBfbKd&sz=w500" alt="張ばあさん">
        <div class="card-body">
            <h2>張ばあさん<br>(ポスト投函パック)</h2>
            <p class="price">2,980円 <span class="yasui-label">（やすいよ）</span></p>
            <a href="obaasan.html" class="btn">張ばあさんを詳しく見る</a>
        </div>
    </div>
</div>

<div style="text-align: center; padding: 20px;">
    <p><strong>たのしいよ。</strong></p>
</div>

<div class="footer">
    <p>Copyright &copy; 2026 swingshop Global Market. All Resighted.</p>
</div>

</body>
</html>
